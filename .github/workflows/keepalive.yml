name: keepalive
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and website
        env:
          API: ${{ secrets.AGENT_API_URL }}
          WEB: ${{ secrets.WEB_URL }}
        run: |
          if [ -n "$API" ]; then curl -fsS --max-time 30 "$API/health" || (sleep 30 && curl -fsS --max-time 60 "$API/health"); fi
          if [ -n "$WEB" ]; then curl -fsS --max-time 30 "$WEB/" > /dev/null; fi
